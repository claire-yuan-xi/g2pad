# G2Pad user config
# Sleep after 15 minutes idle; any key wakes it (kscan is a wakeup source).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# Report battery level to the phone over BLE.
CONFIG_ZMK_BATTERY_REPORTING=y
# Stronger radio for a pad that lives in a pocket.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
