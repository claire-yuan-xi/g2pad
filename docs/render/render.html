<script type="module">
import * as THREE from 'three';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
import {toCreasedNormals} from 'three/addons/utils/BufferGeometryUtils.js';
const q=new URLSearchParams(location.search); const view=q.get('view')||'iso';
const W=+q.get('w')||1600,H=+q.get('h')||1100;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(W,H); r.setPixelRatio(1);

LiPo_402030:['#c9ced6',0.4,0.3],PowerSwitch_PCM12:['#9aa4b1',0.5,0.3],JST_PH_Battery:['#f5f1e6',0.4,0.6],
Switch_Back_Q:['#202225',0.5,0.5],Switch_Up_W:['#202225',0.5,0.5],Switch_Select_E:['#202225',0.5,0.5],Switch_Down_S:['#202225',0.5,0.5],
Keycap_Back_Q:['#6e40c9',2,0.45],Keycap_Up_W:['#2f81f7',2,0.45],Keycap_Select_E:['#1f883d',2,0.45],Keycap_Down_S:['#2f81f7',2,0.45]};

    if(view==='noplate' && (name==='TopPlate'||name.startsWith('Keycap'))) m.visible=false;

  });
}
function go(){

  d.shadow.mapSize.set(4096,4096); d.shadow.bias=-0.0004; d.shadow.normalBias=0.3; Object.assign(d.shadow.camera,{left:-120,right:120,top:120,bottom:-120,near:1,far:600}); s.add(d);

</script></body></html>
